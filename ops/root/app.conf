# The storybook, as dk-srv knows it – TEMPLATE in the repository. ops/root/install.sh fills it in
# and installs it as /etc/dk-srv/apps.d/storybook.conf (keys: dk-srv's etc/app.conf.example).
# the backend runs as its own user, as a systemd service
APP_USER=storybook
SERVICE=storybook.service
# the code: a git clone owned by the admin user (it pulls, installs, builds; the backend only reads)
RUNTIME_DIR=/srv/storybook
DEPLOY_USER=@DEPLOY_USER@
NODE=yes
SITE_URL=https://@DOMAIN@
LOGIN_PATH=/api/login
NPM_DIRS="server client"
MODE_CMD=/usr/local/sbin/storybook-mode
NGINX_SITES="storybook storybook-maintenance"
# changing all the time: the photos, the backups, the dependencies, the built app, the logs, the
# app's state
AIDE_EXCLUDE="/etc/storybook/uploads @DEPLOY_HOME@/backups /srv/storybook/server/node_modules /srv/storybook/client/node_modules /srv/storybook/client/build /var/log/storybook /var/lib/storybook"
# sensitive: the storybook's settings (address, backup key, the deployed app, the maintenance page)
# and its service
AIDE_SENSITIVE="/etc/storybook /etc/systemd/system/storybook.service"
BACKUP_LOG=@DEPLOY_HOME@/backups/storybook/backup.log
RESTORE_TEST_LOG=@DEPLOY_HOME@/backups/storybook/restore-test.log
DATABASES="storybook storybook_restoretest"
DB_OWNER=webapp
DB_NO_AUDIT="storybook_restoretest"
