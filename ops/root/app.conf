# The storybook, as dk-srv knows it – TEMPLATE in the repository. ops/root/install.sh fills it in
# and installs it as /etc/dk-srv/apps.d/storybook.conf (keys: dk-srv's etc/app.conf.example).
APP_USER=@APP_USER@
RUNTIME_DIR=@APP_HOME@/storybook
PM2_PROCESS=backend
NODE=yes
SITE_URL=https://@DOMAIN@
LOGIN_PATH=/api/login
NPM_DIRS="server client"
MODE_CMD=/usr/local/sbin/storybook-mode
NGINX_SITES="storybook storybook-maintenance"
# changing all the time: the photos, the backups, the dependencies, the built app, the app's state
AIDE_EXCLUDE="/etc/storybook/uploads @APP_HOME@/backups @APP_HOME@/storybook/server/node_modules @APP_HOME@/storybook/client/node_modules @APP_HOME@/storybook/client/build /var/lib/storybook"
# sensitive: the storybook's settings (address, backup key, the deployed app, the maintenance page)
AIDE_SENSITIVE="/etc/storybook"
BACKUP_LOG=@APP_HOME@/backups/storybook/backup.log
RESTORE_TEST_LOG=@APP_HOME@/backups/storybook/restore-test.log
DATABASES="storybook storybook_restoretest"
DB_OWNER=webapp
DB_NO_AUDIT="storybook_restoretest"
