# Log rotation of the storybook – TEMPLATE in the repository; ops/root/install.sh installs it as
# /etc/dk-srv/logrotate.d/storybook (@APP_HOME@ and @APP_USER@ filled in). dk-srv runs it every
# hour with its own (/etc/dk-srv/logrotate.conf includes this folder).
# "su": the folders belong to @APP_USER@, so the work is done as @APP_USER@, not as root.

# The backend (pm2): what the server prints – also IP addresses and usernames of failed logins,
# so it's kept for 14 days only. Rotated every day, and earlier when a file passes 20 MB (then the
# 14 copies cover less time, but the disk stays safe). pm2 keeps the file open, so it's copied and
# emptied in place ("copytruncate": no restart; a line written in that very moment can get lost).
@APP_HOME@/.pm2/logs/*.log @APP_HOME@/.pm2/pm2.log {
    su @APP_USER@ @APP_USER@
    daily
    maxsize 20M
    rotate 14
    maxage 14
    copytruncate
}

# The nightly backup (ops/backup.sh, a few lines a night): monthly, a year kept.
@APP_HOME@/backups/storybook/backup.log {
    su @APP_USER@ @APP_USER@
    monthly
    rotate 12
    create
}
