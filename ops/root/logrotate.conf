# Log rotation of the storybook – TEMPLATE in the repository; ops/root/install.sh installs it as
# /etc/dk-srv/logrotate.d/storybook (@DEPLOY_HOME@ and @DEPLOY_USER@ filled in). dk-srv runs it
# every hour with its own (/etc/dk-srv/logrotate.conf includes this folder).

# The backend (storybook.service): what it prints – also IP addresses and usernames of failed
# logins, so it's kept for 14 days only. Rotated every day, and earlier when a file passes 20 MB
# (then the 14 copies cover less time, but the disk stays safe). systemd keeps the file open, so
# it's copied and emptied in place ("copytruncate": no restart; a line written in that very moment
# can get lost). The folder belongs to root (systemd writes the files, not the backend).
/var/log/storybook/*.log {
    daily
    maxsize 20M
    rotate 14
    maxage 14
    copytruncate
    missingok
    notifempty
}

# The nightly backup (ops/backup.sh, a few lines a night): monthly, a year kept. "su": the
# folder belongs to @DEPLOY_USER@, so the work is done as @DEPLOY_USER@, not as root.
@DEPLOY_HOME@/backups/storybook/backup.log {
    su @DEPLOY_USER@ @DEPLOY_USER@
    monthly
    rotate 12
    create
}
