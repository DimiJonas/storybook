# nginx config for MAINTENANCE MODE (sudo storybook-mode maintenance).
#
# Used instead of the normal config (ops/root/nginx/storybook.conf) while the storybook is paused,
# e.g. because of a security problem in one of its libraries. Every address – the app, /api,
# the photos – gets the one page /etc/storybook/maintenance/index.html with status 503
# ("temporarily unavailable"). Nothing is passed to the backend, no photo is served.
#
# Installed once as /etc/nginx/sites-available/storybook-maintenance; switching between the two
# configs = changing what the link /etc/nginx/sites-enabled/storybook points to.
# The certificate lines must be the same as in the normal config.
# (Template like ops/root/nginx/storybook.conf: ops/root/install.sh fills in storybook.example.com
# and the certificate folder from /etc/storybook/site.conf.)

server {
    server_name storybook.example.com;
    server_tokens off;

    root /etc/storybook/maintenance;

    # Security headers (the page has no scripts at all; its styles are inside the page)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # never keep this page (or a 503 for anything else) on the device
    add_header Cache-Control "no-store" always;
    # tells browsers/bots: try again in an hour
    add_header Retry-After "3600" always;

    # Everything answers "503 – maintenance" with the maintenance page
    location / {
        return 503;
    }
    error_page 503 /index.html;
    # (the page itself can't be opened directly – asking for /index.html gets the same 503)
    error_page 404 =503 /index.html;
    location = /index.html {
        internal;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/storybook.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/storybook.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_tokens off;

    if ($host = storybook.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name storybook.example.com;
    return 404; # managed by Certbot
}
