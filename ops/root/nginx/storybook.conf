# nginx config of the storybook – the TEMPLATE in the repository. Don't copy it by hand: on the
# server, ops/root/install.sh (run by `sudo dk-app-update storybook`, dk-srv) fills in your address
# and certificate (from /etc/storybook/site.conf) and installs it as
# /etc/nginx/sites-available/storybook:
#   storybook.example.com                     -> DOMAIN     (e.g. storybook.your-domain.de)
#   /etc/letsencrypt/live/storybook.example.com/ -> CERT_NAME  (the folder certbot made)

limit_req_zone $binary_remote_addr zone=storybook_login:10m rate=10r/m;

# Map pictures ("tiles", step 11): fetched from OpenStreetMap by nginx and kept here for 60 days
# (at most 2 GB), so phones only ever talk to this server – OpenStreetMap doesn't see who looks at
# which area, and each tile is only fetched once. /var/cache/nginx must exist (Ubuntu's nginx
# doesn't have it – see project_setup_commands.txt); nginx creates storybook-tiles inside it.
proxy_cache_path /var/cache/nginx/storybook-tiles levels=1:2 keys_zone=storybook_tiles:10m max_size=2g inactive=60d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=storybook_tiles_rate:10m rate=40r/s;
# All other API requests: 20 per second per IP address, short bursts of up to 100 more (opening the
# app sends a handful; a script hammering the API is slowed down – and fail2ban's
# nginx-limit-req jail bans it if it goes on)
limit_req_zone $binary_remote_addr zone=storybook_api:10m rate=20r/s;

# How long browsers may keep each kind of file (Cache-Control), decided by the address.
# Set once for the whole site below, so no location needs its own add_header (in nginx, an
# add_header inside a location silently drops all add_header lines of the server block –
# including the security headers).
map $uri $storybook_cache_control {
    default "";
    # index.html, the service worker and the app manifest: always check for a new version
    # (otherwise app updates wouldn't arrive)
    /index.html "no-cache";
    ~^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ "no-cache";
    # JS/CSS built by Vite get a new name on every build: browsers may keep them for a year
    ~^/assets/ "public, max-age=31536000, immutable";
    # photos (only for logged-in visitors, step 14) never change: kept only on the device itself
    # ("private" – never in caches in between), for 30 days
    ~^/uploads/ "private, max-age=2592000, immutable";
    # map pictures: a week on the device (nginx keeps them longer, see /tiles/ below)
    ~^/tiles/ "public, max-age=604800";
    # answers of the backend (memories, ...): never store them on the device or in between
    ~^/api/ "no-store";
}

server {
    server_name storybook.example.com;

    # Don't show the nginx version in headers and error pages
    server_tokens off;

    # Requests may be at most 1 MB – only photo uploads may be bigger (50 MB, see below)
    client_max_body_size 1m;

    # Only the methods the app uses (CIS NGINX); anything else (TRACE, PATCH, …) is refused
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) { return 405; }

    # Hidden files (.git, .env, …) are never served, whatever ends up in a folder
    location ~ /\. {
        return 404;
    }

    # Compress text responses (JS, CSS, API JSON) before sending them
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /etc/storybook/clientbuild;

    add_header Cache-Control $storybook_cache_control;

    # Security headers (for every answer, also errors – that's what "always" does):
    #   HSTS: browsers that have been here once use only HTTPS for a year, even if someone types
    #     http:// (protects e.g. on public Wi-Fi)
    #   Content-Security-Policy: the browser only runs scripts, styles, pictures, ... from this
    #     website itself. If a bug ever let someone smuggle code into a page, the browser wouldn't
    #     run it. (The login is a cookie scripts can't read at all – step 14.)
    #     (img-src data:/blob: = the previews of selected photos in the form)
    #   nosniff: browsers must not guess file types (an uploaded file is never run as a page)
    #   X-Frame-Options / frame-ancestors: other websites can't show the app inside a frame
    #     (protects against click tricks)
    #   Referrer-Policy: other websites aren't told which page of the app a link came from
    #   Permissions-Policy: the app may not use microphone, location, payment or USB
    #     (camera is left out on purpose: taking a photo in the add form must keep working)
    #   Cross-Origin-*: other websites can't embed our photos/files or keep a handle on our window
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Serve the React app (frontend); pages like /b/1/memory/5 are all answered with index.html
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Phone app: nginx doesn't know the file type of the app manifest (.webmanifest) yet
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        types {
            application/javascript js;
            application/manifest+json webmanifest;
        }
    }

    # Photos: served by nginx straight from disk (faster than going through Node) – but only to
    # logged-in visitors: before each photo nginx asks the backend (auth_request, see
    # /_photo_auth below); without a valid login cookie the answer is 401 instead of the photo.
    # Only photo types are shown as pictures; any other file that might ever end up in the folder
    # (e.g. a .html or .svg) is only offered as a download – the browser never runs it as a page.
    location /uploads/ {
        auth_request /_photo_auth;
        alias /etc/storybook/uploads/;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
            image/gif  gif;
            image/heic heic;
            image/heif heif;
            image/avif avif;
        }
        default_type application/octet-stream;
    }

    # The question nginx asks for every photo (internal: not reachable from outside). The backend
    # checks the login cookie and the photo's storybook (/api/auth/photo); it remembers checked
    # logins for half a minute, so photo grids stay fast.
    location = /_photo_auth {
        internal;
        proxy_pass http://127.0.0.1:3001/api/auth/photo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Map pictures from OpenStreetMap, through this server (see proxy_cache_path at the top).
    # Only for pages of this site (Referer) – an open tile proxy would be used by others and get
    # this server blocked by OpenStreetMap. Nothing of the visitor (cookies, login) is passed on.
    location /tiles/ {
        valid_referers server_names;
        if ($invalid_referer) { return 403; }
        if ($uri !~ "^/tiles/[0-9]{1,2}/[0-9]{1,7}/[0-9]{1,7}\.png$") { return 404; }
        if ($args) { return 404; } # no "?...": it would get around the cache
        limit_req zone=storybook_tiles_rate burst=200 nodelay;
        limit_req_status 429;

        proxy_pass https://tile.openstreetmap.org/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "Storybook/1.0 (private family app; https://storybook.example.com)";
        proxy_set_header Referer "https://storybook.example.com/";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;

        proxy_cache storybook_tiles;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # (no add_header here: it would drop the security headers above for this location)
    }

    # Login: rate-limited (see limit_req_zone at the top)
    location = /api/login {
        limit_req zone=storybook_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Photo uploads: the only requests that may be big (up to 10 photos of 50 MB each go one at a
    # time from the app, so 50 MB per request)
    location ~ ^/api/books/[0-9]+/upload$ {
        client_max_body_size 50M;
        limit_req zone=storybook_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Proxy API requests to the Express backend
    location /api/ {
        limit_req zone=storybook_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/storybook.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/storybook.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_tokens off;

    if ($host = storybook.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name storybook.example.com;
    return 404; # managed by Certbot
}
