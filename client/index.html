<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a855f7" />
    <meta name="description" content="Unser Storybook" />
    <!-- iPhone/iPad: icon and name on the home screen, open like an app -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Storybook" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- the link to the app manifest is added by vite-plugin-pwa when building -->
    <title>Storybook</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Start screen, shown from the first moment until the app has loaded. The app fades it out
         (src/splash.js); styles: .splash in src/index.css -->
    <div id="splash" class="splash" role="status" aria-label="Storybook wird geladen">
      <span class="splash__star" aria-hidden="true">✦</span>
      <span class="splash__star" aria-hidden="true">✦</span>
      <span class="splash__star" aria-hidden="true">✦</span>
      <span class="splash__star" aria-hidden="true">✦</span>
      <span class="splash__star" aria-hidden="true">✦</span>
      <span class="splash__star" aria-hidden="true">✦</span>
      <img class="splash__icon" src="/splash-icon.webp" alt="" />
      <div class="splash__title">Storybook</div>
      <div class="splash__hint">Erinnerungen werden geladen …</div>
    </div>
    <div id="root"></div>
    <!-- Vite starts the app from this file (replaces src/index.js from Create React App) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
